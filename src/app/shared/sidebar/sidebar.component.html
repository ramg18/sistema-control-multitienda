<nav class="sidebar">

      <div class="brand-name">MultiTienda</div>
      <div class="brand-sub">Control de Tiendas</div>
    </div>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-label">PRINCIPAL</div>
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">📊</span>
      <span>Dashboard</span>
    </a>
    <a routerLink="/ventas" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">🧾</span>
      <span>Ventas</span>

    <a routerLink="/compras" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">🛒</span>
      <span>Compras</span>
    </a>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-label">ANÁLISIS</div>

      <span class="nav-icon">📈</span>
      <span>Reportes</span>

    <a routerLink="/auditoria" routerLinkActive="active" class="nav-item">
      <span class="nav-icon">🔍</span>
      <span>Auditoría</span>
    </a>
  </div>
