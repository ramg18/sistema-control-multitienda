<div class="sidebar-overlay" *ngIf="isOpen" (click)="close.emit()"></div>
<nav class="sidebar" [class.open]="isOpen">
  <div class="sidebar-brand">
    <div class="brand-icon">⬡</div>
    <div>
      <div class="brand-name">MultiTienda</div>
      <div class="brand-sub">Control de Tiendas</div>
    </div>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-label">PRINCIPAL</div>
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-item" (click)="close.emit()">
      <span class="nav-icon">📊</span>
      <span>Dashboard</span>
    </a>
    <a routerLink="/ventas" routerLinkActive="active" class="nav-item" (click)="close.emit()">
      <span class="nav-icon">🧾</span>
      <span>Ventas</span>
    </a>
    <a routerLink="/compras" routerLinkActive="active" class="nav-item" (click)="close.emit()">
      <span class="nav-icon">🛒</span>
      <span>Compras</span>
    </a>
    <a routerLink="/proveedores" routerLinkActive="active" class="nav-item" (click)="close.emit()">
      <span class="nav-icon">🤝</span>
      <span>Proveedores</span>
    </a>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-label">ANÁLISIS</div>
    <a routerLink="/reportes" routerLinkActive="active" class="nav-item" (click)="close.emit()">
      <span class="nav-icon">📈</span>
      <span>Reportes Estáticos</span>
    </a>
    <a routerLink="/analitica" routerLinkActive="active" class="nav-item" (click)="close.emit()">
      <span class="nav-icon">💼</span>
      <span>Análisis Gerencial</span>
    </a>
    <a routerLink="/auditoria" routerLinkActive="active" class="nav-item" (click)="close.emit()">
      <span class="nav-icon">🔍</span>
      <span>Auditoría</span>
    </a>
  </div>

  <div class="sidebar-section" *ngIf="isAdmin">
    <div class="sidebar-label">ADMINISTRACIÓN</div>
    <a routerLink="/configuracion/tiendas" routerLinkActive="active" class="nav-item" (click)="close.emit()">
      <span class="nav-icon">🏪</span>
      <span>Tiendas</span>
    </a>
    <a routerLink="/configuracion/usuarios" routerLinkActive="active" class="nav-item" (click)="close.emit()">
      <span class="nav-icon">👥</span>
      <span>Usuarios</span>
    </a>
    <a routerLink="/configuracion" routerLinkActive="active" class="nav-item" [routerLinkActiveOptions]="{exact: true}" (click)="close.emit()">
      <span class="nav-icon">⚙️</span>
      <span>Ajustes</span>
    </a>
  </div>

  <div class="sidebar-footer">
    <div class="user-info">
      <div class="user-avatar">{{ userInitials }}</div>
      <div class="user-details">
        <div class="user-name">{{ userName }}</div>
        <div class="user-role">{{ roleLabel }}</div>
      </div>
    </div>
    <button class="logout-btn" (click)="logout()" title="Cerrar sesión">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:20px; height:20px">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
      </svg>
    </button>
  </div>
</nav>
