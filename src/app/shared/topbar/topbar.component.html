<header class="topbar">
  <div class="topbar-left">
    <button class="btn btn-icon mobile-menu-btn" (click)="toggleSidebar.emit()" title="Abrir menú">☰</button>
    <h1 class="page-heading">{{ pageTitle }}</h1>
  </div>
  <div class="topbar-right">
    <div class="year-selector">
      <select class="form-control" [(ngModel)]="selectedYear" (change)="onYearChange()">
        <option *ngFor="let y of years" [value]="y">{{ y }}</option>
      </select>
    </div>
    <div class="store-badge" *ngIf="storeName">
      <span>🏪</span> {{ storeName }}
    </div>
    <div class="topbar-divider"></div>
    <button class="btn btn-icon" (click)="logout()" title="Cerrar sesión">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" style="width:22px; height:22px">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9" />
      </svg>
    </button>
  </div>
</header>
