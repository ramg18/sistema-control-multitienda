<div *ngIf="error" class="alert alert-danger">{{ error }}</div>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <div class="form-row">
    <div class="form-group">
      <label class="form-label">Tienda *</label>
      <select class="form-control" formControlName="store_id">
        <option value="">Selecciona tienda</option>
        <option *ngFor="let s of stores" [value]="s.id">{{ s.name }}</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Proveedor *</label>
      <select class="form-control" formControlName="supplier_id">
        <option value="">Selecciona proveedor</option>
        <option *ngFor="let s of suppliers" [value]="s.id">{{ s.name }} — {{ s.nit }}</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">Fecha *</label>
      <input type="date" class="form-control" formControlName="purchase_date" />
    </div>
  </div>
  <div class="form-row">
    <div class="form-group">
      <label class="form-label">Prefijo *</label>
      <input type="text" class="form-control" formControlName="prefix" placeholder="Ej: FT" />
    </div>
    <div class="form-group">
      <label class="form-label">Número Factura *</label>
      <input type="text" class="form-control" formControlName="invoice_number" />
    </div>
    <div class="form-group">
      <label class="form-label">Total Factura *</label>
      <input type="number" class="form-control form-control-mono" formControlName="total_invoice" placeholder="Total a Pagar" />
    </div>
    <div class="form-group">
      <label class="form-label">% IVA *</label>
      <select class="form-control form-control-mono" formControlName="iva_percentage">
        <option [ngValue]="19">19% (Estándar)</option>
        <option [ngValue]="5">5% (Reducido)</option>
        <option [ngValue]="0">0% (Exento)</option>
      </select>
    </div>
  </div>

  <div class="form-row bg-slate-50 p-4 rounded-lg border border-slate-200 mb-4 items-center">
    <div class="form-group flex-1 mb-0">
      <label class="form-label text-xs text-slate-500 !mb-1">Base Gravable (Subtotal) Calculada</label>
      <input type="number" class="form-control form-control-mono bg-transparent border-none text-slate-600 font-bold p-0" formControlName="subtotal" readonly tabindex="-1" />
    </div>
    <div class="form-group flex-1 mb-0">
      <label class="form-label text-xs text-slate-500 !mb-1">IVA Deducido</label>
      <input type="number" class="form-control form-control-mono bg-transparent border-none text-slate-600 font-bold p-0" formControlName="tax_amount" readonly tabindex="-1" />
    </div>
  </div>
  <div class="form-row">
    <div class="form-group" style="flex:2">
      <label class="form-label">Observaciones</label>
      <input type="text" class="form-control" formControlName="observations" />
    </div>
    <div class="form-group" style="flex:1">
      <label class="form-label">Condición de Pago *</label>
      <select class="form-control" formControlName="is_credit">
        <option [ngValue]="false">Al Contado</option>
        <option [ngValue]="true">A Crédito</option>
      </select>
    </div>
    <div class="form-group" style="flex:1" *ngIf="form.get('is_credit')?.value">
      <label class="form-label">Fecha de Vencimiento *</label>
      <input type="date" class="form-control" formControlName="due_date" />
    </div>
  </div>

  <!-- Retentions -->
  <div class="pm-section">
    <div class="pm-header">
      <span class="form-label">Retenciones (Colombia)</span>
      <button type="button" class="btn btn-secondary btn-sm" (click)="addRet()">+ Agregar Retención</button>
    </div>
    <div formArrayName="retentions">
      <div *ngFor="let r of rets.controls; let i = index" [formGroupName]="i" class="pm-row">
        <select class="form-control" formControlName="retention_type_id" style="flex:2" (change)="onRetTypeChange(i)">
          <option value="">Tipo de retención</option>
          <option *ngFor="let rt of retentionTypes" [value]="rt.id">{{ rt.name }} ({{ rt.rate * 100 | number:'1.0-2' }}%)</option>
        </select>
        <input type="number" class="form-control form-control-mono" formControlName="base" placeholder="Base" style="flex:1" />
        <input type="number" class="form-control form-control-mono" formControlName="rate" placeholder="Tasa" style="flex:1" step="0.001" />
        <button type="button" class="btn btn-icon btn-sm" (click)="removeRet(i)" style="color:var(--danger)">✕</button>
      </div>
    </div>
  </div>

  <div class="form-actions">
    <button type="button" class="btn btn-secondary" (click)="cancelled.emit()">Cancelar</button>
    <button type="button" class="btn btn-primary" [disabled]="saving" (click)="onSubmit()">
      {{ saving ? 'Guardando...' : (purchase ? 'Actualizar' : 'Guardar Compra') }}
    </button>
  </div>
</form>
