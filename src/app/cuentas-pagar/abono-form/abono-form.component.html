<form [formGroup]="form" (ngSubmit)="onSubmit()">

  <div class="row">
    <div class="col-md-6 mb-16">
      <label class="form-label">Total a Abonar <span class="text-danger">*</span></label>
      <div class="input-group">
        <span class="input-group-text">$</span>
        <input type="number" class="form-control" formControlName="amount" min="1" step="0.01">
      </div>
      <div class="text-danger small mt-1" *ngIf="form.get('amount')?.invalid && form.get('amount')?.touched">
        Valor inválido
      </div>
      <div class="text-muted small mt-1">Saldo base: {{ accountPayable.balance | currency:'COP':'symbol-narrow':'1.0-0' }}</div>
    </div>

    <div class="col-md-6 mb-16">
      <label class="form-label">Fecha de Abono <span class="text-danger">*</span></label>
      <input type="date" class="form-control" formControlName="payment_date">
    </div>

    <div class="col-md-6 mb-16">
      <label class="form-label">Método de Pago</label>
      <select class="form-select text-input" formControlName="payment_method">
        <option value="Efectivo">Efectivo</option>
        <option value="Transferencia">Transferencia Bancaria</option>
        <option value="Tarjeta">Tarjeta (Débito/Crédito)</option>
        <option value="Cheque">Cheque</option>
        <option value="Otro">Otro</option>
      </select>
    </div>

    <div class="col-md-6 mb-16">
      <label class="form-label">Núm. de Referencia / Transacción</label>
      <input type="text" class="form-control" formControlName="reference_number" placeholder="Opcional">
    </div>

    <div class="col-12 mb-16">
      <label class="form-label">Notas Adicionales</label>
      <textarea class="form-control" formControlName="notes" rows="2" placeholder="Opcional"></textarea>
    </div>
  </div>

  <div class="d-flex justify-content-end gap-12 mt-16 border-top pt-16">
    <button type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="saving">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid || saving">
      <span *ngIf="saving" class="spinner-border spinner-border-sm me-2"></span> Guardar Abono
    </button>
  </div>
</form>
